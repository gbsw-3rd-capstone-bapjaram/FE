name: bapjaram
description: "경북소프트웨어마이스터고 급식 맞춤 식단 가이드"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # 로컬 저장소 (토큰)
  shared_preferences: ^2.3.3

  # 라우팅
  go_router: ^14.6.2

  # 원형 차트
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Paperlogy
      fonts:
        - asset: fonts/Paperlogy-1Thin.ttf
          weight: 100
        - asset: fonts/Paperlogy-2ExtraLight.ttf
          weight: 200
        - asset: fonts/Paperlogy-3Light.ttf
          weight: 300
        - asset: fonts/Paperlogy-4Regular.ttf
          weight: 400
        - asset: fonts/Paperlogy-5Medium.ttf
          weight: 500
        - asset: fonts/Paperlogy-6SemiBold.ttf
          weight: 600
        - asset: fonts/Paperlogy-7Bold.ttf
          weight: 700
        - asset: fonts/Paperlogy-8ExtraBold.ttf
          weight: 800
        - asset: fonts/Paperlogy-9Black.ttf
          weight: 900
